version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: nexus_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: nexus_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped